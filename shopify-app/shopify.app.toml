# https://shopify.dev/docs/apps/tools/cli/configuration
# Canonical app config for ecom-workflow → n8n `/webhook/ecom-shopify`.
# After WEBHOOK_URL / ngrok changes: update uri (+ redirect_urls), then `shopify app deploy`.

client_id = "3968ec03aca9f8a3d393c46495e7e6b5"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = false
name = "n8n ecom demo"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [
  "products/create",
  "products/update",
  "inventory_levels/update",
  "orders/create",
  "orders/updated",
  "refunds/create",
]
uri = "https://n8n.nanlin-portfolio.xyz/webhook/ecom-shopify"

[access_scopes]
scopes = "write_inventory,read_inventory,read_locations,read_orders,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://n8n.nanlin-portfolio.xyz/shopify/auth/callback",
]
